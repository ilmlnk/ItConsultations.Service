<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Token Generator</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin: 10px 0; }
        label { display: inline-block; width: 100px; }
        input { padding: 5px; width: 200px; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .error { color: red; }
        .success { color: green; }
        textarea { width: 100%; font-family: monospace; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Firebase Token Generator</h1>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" value="test@example.com">
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" value="password123">
        </div>
        
        <div class="form-group">
            <button onclick="signIn()">Sign In</button>
            <button onclick="signUp()">Sign Up</button>
            <button onclick="getToken()">Get ID Token</button>
            <button onclick="signOut()">Sign Out</button>
        </div>
        
        <div id="status"></div>
        
        <div class="form-group">
            <h3>ID Token:</h3>
            <textarea id="tokenOutput" rows="10" cols="80" readonly placeholder="Token will appear here after authentication"></textarea>
        </div>
        
        <div class="form-group">
            <h3>User Info:</h3>
            <pre id="userInfo">No user signed in</pre>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyC0XO07rxC7bDsw40KdJhBXmXPem_a63PU",
            authDomain: "itconsultations-4c02c.firebaseapp.com",
            projectId: "itconsultations-4c02c",
            storageBucket: "itconsultations-4c02c.firebasestorage.app",
            messagingSenderId: "149149625908",
            appId: "1:149149625908:web:81b557596f0f87673fa461",
            measurementId: "G-WBZC2HTXDH"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        function showStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="${isError ? 'error' : 'success'}">${message}</div>`;
            setTimeout(() => statusDiv.innerHTML = '', 5000);
        }

        async function signIn() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                showStatus('Signing in...');
                const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                console.log('Signed in:', userCredential.user);
                updateUserInfo(userCredential.user);
                showStatus('Successfully signed in!');
            } catch (error) {
                console.error('Sign in error:', error);
                if (error.code === 'auth/invalid-login-credentials') {
                    showStatus('User not found. Try clicking "Sign Up" first.', true);
                } else {
                    showStatus('Sign in error: ' + error.message, true);
                }
            }
        }

        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                showStatus('Creating account...');
                const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                console.log('Signed up:', userCredential.user);
                updateUserInfo(userCredential.user);
                showStatus('Account created successfully!');
            } catch (error) {
                console.error('Sign up error:', error);
                if (error.code === 'auth/email-already-in-use') {
                    showStatus('User already exists. Try signing in instead.', true);
                } else {
                    showStatus('Sign up error: ' + error.message, true);
                }
            }
        }

        async function getToken() {
            const user = firebase.auth().currentUser;
            if (!user) {
                showStatus('Please sign in first', true);
                return;
            }
            
            try {
                showStatus('Getting ID token...');
                const idToken = await user.getIdToken();
                document.getElementById('tokenOutput').value = idToken;
                console.log('ID Token:', idToken);
                showStatus('ID Token retrieved successfully!');
            } catch (error) {
                console.error('Get token error:', error);
                showStatus('Get token error: ' + error.message, true);
            }
        }

        async function signOut() {
            try {
                await firebase.auth().signOut();
                showStatus('Signed out successfully!');
            } catch (error) {
                console.error('Sign out error:', error);
                showStatus('Sign out error: ' + error.message, true);
            }
        }

        function updateUserInfo(user) {
            document.getElementById('userInfo').textContent = JSON.stringify({
                uid: user.uid,
                email: user.email,
                displayName: user.displayName,
                emailVerified: user.emailVerified,
                providerData: user.providerData.map(provider => ({
                    providerId: provider.providerId,
                    email: provider.email
                }))
            }, null, 2);
        }

        // Listen for auth state changes
        firebase.auth().onAuthStateChanged(function(user) {
            if (user) {
                console.log('User is signed in:', user);
                updateUserInfo(user);
                showStatus('User is signed in: ' + user.email);
            } else {
                console.log('User is signed out');
                document.getElementById('userInfo').textContent = 'No user signed in';
                document.getElementById('tokenOutput').value = '';
            }
        });
    </script>
</body>
</html>
